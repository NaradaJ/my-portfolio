<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How a GSTS ticket moves</title>
  <desc id="d">An officer records a request, which becomes a ticket with an ID and an assigned officer. Steps are defined in stages. Steps are completed or skipped; a ticket only progresses when every compulsory step in the stage is done, and is completed after the last stage. When another officer opens the ticket they must approve or flag the previous work; a flag notifies the officer who defined the workflow.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8e96a1"/></marker>
  </defs>
  <rect width="1040" height="400" rx="18" fill="#0f1114"/>
  <g font-size="14" fill="#eceef0">
    <rect x="30" y="60" width="170" height="78" rx="12" fill="#14171c" stroke="#2a2f37"/>
    <text x="115" y="94" text-anchor="middle">Officer records</text><text x="115" y="114" text-anchor="middle">citizen request</text>

    <rect x="240" y="60" width="190" height="78" rx="12" fill="#14171c" stroke="#2a2f37"/>
    <text x="335" y="90" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace" font-size="12" fill="#f0883e">GST-YYYY-NNNNNN</text>
    <text x="335" y="114" text-anchor="middle">assigned to an officer</text>

    <rect x="470" y="60" width="180" height="78" rx="12" fill="#14171c" stroke="#2a2f37"/>
    <text x="560" y="94" text-anchor="middle">Verify requirement,</text><text x="560" y="114" text-anchor="middle">define steps in stages</text>

    <rect x="690" y="60" width="150" height="78" rx="12" fill="#14171c" stroke="#2a2f37"/>
    <text x="765" y="94" text-anchor="middle">Complete / skip</text><text x="765" y="114" text-anchor="middle">steps</text>

    <path d="M765 175 L835 215 L765 255 L695 215 Z" fill="#14171c" stroke="#fff6e0"/>
    <text x="765" y="210" text-anchor="middle" font-size="12">Compulsory</text><text x="765" y="226" text-anchor="middle" font-size="12">steps done?</text>

    <rect x="905" y="176" width="115" height="78" rx="39" fill="#1c1a12" stroke="#fff6e0"/>
    <text x="962" y="210" text-anchor="middle">Completed</text><text x="962" y="230" text-anchor="middle" font-size="12" fill="#a3aab4">time recorded</text>

    <rect x="240" y="290" width="190" height="78" rx="12" fill="#14171c" stroke="#2a2f37"/>
    <text x="335" y="324" text-anchor="middle">Another officer opens:</text><text x="335" y="344" text-anchor="middle">Approve or Flag?</text>

    <rect x="490" y="290" width="200" height="78" rx="12" fill="#1f1610" stroke="#f0883e"/>
    <text x="590" y="324" text-anchor="middle">Flagged: originating</text><text x="590" y="344" text-anchor="middle">officer is notified</text>
  </g>
  <g stroke="#8e96a1" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M200 99 H236"/>
    <path d="M430 99 H466"/>
    <path d="M650 99 H686"/>
    <path d="M765 138 V171"/>
    <path d="M835 215 H901"/>
    <path d="M695 215 H640 Q620 215 620 195 V150 Q620 130 640 125 L686 118"/>
    <path d="M335 138 V286" stroke-dasharray="5 5"/>
    <path d="M430 329 H486"/>
  </g>
  <g font-size="12" fill="#a3aab4">
    <text x="842" y="207">Yes, last</text><text x="842" y="234">stage</text>
    <text x="688" y="240" text-anchor="end">No / next stage</text>
    <text x="345" y="215">another officer</text>
    <text x="440" y="320">Flag</text>
  </g>
  <text x="30" y="36" font-size="13" fill="#8e96a1" letter-spacing="1.5">HOW A TICKET MOVES · EVERY ACTION IS LOGGED</text>
</svg>
