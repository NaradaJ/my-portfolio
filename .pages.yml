# Pages CMS configuration: https://pagescms.org/docs
# Sign in at https://app.pagescms.org with GitHub, open this repo, and edit content with forms.
# Every save is a commit to master, which redeploys the site automatically.

media:
  input: src/assets/photos
  output: ../../assets/photos
  extensions: [jpg, jpeg, png, webp]

content:
  - name: journal
    label: Journal
    type: collection
    path: src/content/journal
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, draft]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: summary, label: One-line summary, type: text, description: "Shown in lists and search results." }
      - { name: draft, label: Draft (hide from site), type: boolean, default: false }
      - { name: body, label: Entry, type: rich-text }

  - name: photos
    label: Photos
    type: collection
    path: src/content/photos
    filename: "{primary}.md"
    view:
      fields: [image, title, featured, order]
      sort: [order]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: image, label: Photo (JPG, location off), type: image, required: true }
      - { name: alt, label: Description for screen readers, type: string, required: true, description: "Describe what is in the photo in one sentence." }
      - { name: caption, label: Caption, type: string }
      - { name: featured, label: Show on home page, type: boolean, default: false, description: "The first three featured photos appear on the home page." }
      - { name: order, label: Order, type: number, default: 100, description: "Lower numbers appear first." }

  - name: work
    label: Projects
    type: collection
    path: src/content/work
    filename: "{primary}.md"
    view:
      fields: [title, ticket, order]
      sort: [order]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: ticket, label: Ticket ID, type: string, description: "e.g. NK-2026-004" }
      - { name: kind, label: Type, type: string, description: "e.g. Case study, Automation, Personal" }
      - { name: summary, label: One-line summary, type: text, required: true }
      - { name: role, label: Role, type: string }
      - { name: year, label: Year, type: number }
      - { name: stack, label: Tech stack, type: string, list: true }
      - { name: repo, label: GitHub link, type: string }
      - { name: live, label: Live link, type: string }
      - { name: order, label: Order, type: number, description: "Lower numbers appear first." }
      - { name: body, label: Case study, type: rich-text }

  - name: profile
    label: Profile & home page text
    type: file
    path: src/data/profile.json
    format: json
    fields:
      - { name: name, label: Name, type: string }
      - { name: jobTitle, label: Job title, type: string }
      - { name: employer, label: Employer, type: string }
      - { name: location, label: Location, type: string }
      - { name: email, label: Contact email, type: string }
      - { name: cv, label: CV file path, type: string, description: "Path to the CV PDF in the public folder, e.g. /Narada-Kasun-CV.pdf. Upload a new PDF with the same name to replace it." }
      - { name: seoTitle, label: Browser tab / Google title, type: string }
      - { name: seoDescription, label: Google description, type: text }
      - name: hero
        label: Hero (top of home page)
        type: object
        fields:
          - { name: kicker, label: Small line above headline, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: emphasis, label: Glowing last word(s), type: string }
          - { name: intro, label: Intro paragraph, type: text }
      - name: about
        label: About section
        type: object
        fields:
          - { name: title, label: Heading, type: string }
          - { name: text, label: Paragraph, type: text }
          - name: stats
            label: Stats
            type: object
            list: true
            fields:
              - { name: value, label: Number, type: string }
              - { name: label, label: Label, type: string }
      - name: offClock
        label: Off the clock section
        type: object
        fields:
          - { name: title, label: Heading, type: string }
          - { name: text, label: Paragraph, type: text }
      - name: journey
        label: Career journey
        type: object
        list: true
        fields:
          - { name: when, label: Years, type: string }
          - { name: title, label: Title, type: string }
          - { name: desc, label: Description, type: text }
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - { name: name, label: Institution, type: string }
          - { name: detail, label: Degree, type: string }
      - { name: tools, label: Tools strip, type: string, list: true }
      - { name: knowsAbout, label: Skills (for search engines), type: string, list: true }
      - name: faq
        label: Quick answers (FAQ)
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }
      - name: links
        label: Links
        type: object
        fields:
          - { name: linkedin, label: LinkedIn URL, type: string }
          - { name: github, label: GitHub URL, type: string }
